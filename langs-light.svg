<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" role="img" aria-label="Most Used Languages">
  <title>Most Used Languages</title>
  <style>
    .title { font: 600 18px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; fill: #0969DA; }
    .label { font: 400 14px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; fill: #656D76; }
    .value { font: 700 14px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; fill: #1F2328; }
    .big   { font: 700 26px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; fill: #1F2328; }
    .small { font: 400 12px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; fill: #656D76; }
    .fade  { opacity: 0; animation: fadein .6s ease-out forwards; }
    @keyframes fadein { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .fade { animation: none; opacity: 1; } }
  </style>
  <rect x="0.5" y="0.5" rx="10" width="494" height="194" fill="#FFFFFF" stroke="#D0D7DE"/>
  <text x="25" y="36" class="title">Most Used Languages</text>
  <clipPath id="bar"><rect x="25" y="54" width="445" height="10" rx="5"/></clipPath>
  <g clip-path="url(#bar)"><rect x="25" y="54" width="445" height="10" fill="#EAEEF2"/>
    <rect x="25.00" y="54" width="95.58" height="10" fill="#E34C26"/>
    <rect x="120.58" y="54" width="90.59" height="10" fill="#4F5D95"/>
    <rect x="211.17" y="54" width="88.30" height="10" fill="#F1E05A"/>
    <rect x="299.47" y="54" width="48.60" height="10" fill="#3178C6"/>
    <rect x="348.07" y="54" width="46.89" height="10" fill="#00B4AB"/>
    <rect x="394.96" y="54" width="34.24" height="10" fill="#41B883"/>
    <rect x="429.20" y="54" width="28.31" height="10" fill="#663399"/>
    <rect x="457.51" y="54" width="12.49" height="10" fill="#C6538C"/>
  </g>
  <g class="fade" style="animation-delay:0ms"><circle cx="31" cy="88" r="5" fill="#E34C26"/><text x="43" y="92" class="value">HTML</text><text x="231" y="92" class="label" text-anchor="end">21.5%</text></g>
  <g class="fade" style="animation-delay:90ms"><circle cx="261" cy="88" r="5" fill="#4F5D95"/><text x="273" y="92" class="value">PHP</text><text x="461" y="92" class="label" text-anchor="end">20.4%</text></g>
  <g class="fade" style="animation-delay:180ms"><circle cx="31" cy="113" r="5" fill="#F1E05A"/><text x="43" y="117" class="value">JavaScript</text><text x="231" y="117" class="label" text-anchor="end">19.8%</text></g>
  <g class="fade" style="animation-delay:270ms"><circle cx="261" cy="113" r="5" fill="#3178C6"/><text x="273" y="117" class="value">TypeScript</text><text x="461" y="117" class="label" text-anchor="end">10.9%</text></g>
  <g class="fade" style="animation-delay:360ms"><circle cx="31" cy="138" r="5" fill="#00B4AB"/><text x="43" y="142" class="value">Dart</text><text x="231" y="142" class="label" text-anchor="end">10.5%</text></g>
  <g class="fade" style="animation-delay:450ms"><circle cx="261" cy="138" r="5" fill="#41B883"/><text x="273" y="142" class="value">Vue</text><text x="461" y="142" class="label" text-anchor="end">7.7%</text></g>
  <g class="fade" style="animation-delay:540ms"><circle cx="31" cy="163" r="5" fill="#663399"/><text x="43" y="167" class="value">CSS</text><text x="231" y="167" class="label" text-anchor="end">6.4%</text></g>
  <g class="fade" style="animation-delay:630ms"><circle cx="261" cy="163" r="5" fill="#C6538C"/><text x="273" y="167" class="value">SCSS</text><text x="461" y="167" class="label" text-anchor="end">2.8%</text></g>
</svg>
